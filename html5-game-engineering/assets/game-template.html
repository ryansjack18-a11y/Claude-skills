<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Orb Runner</title>
<style>
  /* ===== THEME (restyle freely) ===== */
  :root {
    --bg: #0b0f1a; --panel: rgba(12, 16, 30, 0.88); --fg: #e8ecf5; --muted: #8a93a8;
    --accent: #4cc9f0; --danger: #f72585; --ok: #80ed99;
    --controls-h: 0px; /* space reserved below the game for touch controls */
    --aspect-w: 16; --aspect-h: 9; --max-w: 800px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 12px; min-height: 100vh; min-height: 100dvh; padding: 12px; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }

  /* Width is the smallest of: the viewport, the max width, and what still fits vertically.
     Height follows from aspect-ratio, so the game never distorts or overflows. */
  #game { position: relative; overflow: hidden; border-radius: 12px; background: #000;
    width: min(100%, var(--max-w), calc((100dvh - 24px - var(--controls-h)) * var(--aspect-w) / var(--aspect-h)));
    aspect-ratio: var(--aspect-w) / var(--aspect-h); box-shadow: 0 10px 40px rgba(0,0,0,.5); outline: none; }
  #canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

  #hud { position: absolute; top: 0; left: 0; right: 0; display: flex; justify-content: space-between;
    align-items: center; gap: 8px; padding: 8px 12px; font-weight: 700; font-size: clamp(12px, 2.4vw, 18px);
    pointer-events: none; text-shadow: 0 1px 2px #000; }
  #hud .group { display: flex; gap: 14px; align-items: center; }
  #hud button { pointer-events: auto; }

  .screen { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 12px; padding: 16px; text-align: center; background: var(--panel); }
  .screen[hidden], #hud[hidden], #debug[hidden] { display: none; }
  .screen h1 { margin: 0; font-size: clamp(24px, 6vw, 48px); letter-spacing: .04em; color: var(--accent); }
  .screen p { margin: 0; color: var(--muted); max-width: 46ch; font-size: clamp(12px, 2.2vw, 16px); }
  .keys { display: grid; grid-template-columns: auto auto; gap: 4px 14px; font-size: clamp(11px, 2vw, 15px); text-align: left; }
  kbd { background: #222a40; border: 1px solid #39425e; border-bottom-width: 3px; border-radius: 5px; padding: 1px 6px; font-family: inherit; }
  .big { font-size: clamp(28px, 7vw, 56px); font-weight: 800; color: var(--fg); }
  .badge { color: var(--ok); font-weight: 700; }

  button { font: inherit; cursor: pointer; border: 0; border-radius: 10px; color: #001018; background: var(--accent);
    padding: 10px 22px; font-weight: 800; font-size: clamp(14px, 2.6vw, 18px); }
  button:focus-visible { outline: 3px solid var(--fg); outline-offset: 2px; }
  button.ghost { background: transparent; color: var(--fg); border: 1px solid #39425e; padding: 4px 10px; font-size: 14px; }

  /* Hidden until something crashes. */
  #debug { position: absolute; left: 8px; right: 8px; bottom: 8px; z-index: 10; padding: 10px 12px; border-radius: 8px;
    background: rgba(40, 0, 12, .94); border: 1px solid var(--danger); color: #ffd6e2; font: 12px/1.4 ui-monospace, monospace; }
  #debug strong { color: #fff; }
  #debug .row { display: flex; gap: 8px; margin-top: 8px; }
  #debug button { font-size: 12px; padding: 4px 10px; background: var(--danger); color: #fff; }

  /* On-screen controls: shown on touch devices, hidden on mouse/keyboard devices. */
  #touch { display: none; gap: 16px; align-items: center; justify-content: center; touch-action: none; }
  #touch button { width: 64px; height: 64px; padding: 0; font-size: 24px; border-radius: 14px; background: #222a40; color: var(--fg); }
  #touch button.active { background: var(--accent); color: #001018; }
  .dpad { display: grid; grid-template-columns: repeat(3, 64px); grid-template-rows: repeat(2, 64px); gap: 6px; }
  .dpad [data-key="ArrowUp"] { grid-column: 2; } .dpad [data-key="ArrowLeft"] { grid-column: 1; grid-row: 2; }
  .dpad [data-key="ArrowDown"] { grid-column: 2; grid-row: 2; } .dpad [data-key="ArrowRight"] { grid-column: 3; grid-row: 2; }
  @media (hover: none) and (pointer: coarse) {
    :root { --controls-h: 150px; }
    #touch { display: flex; }
    .desktop-only { display: none; }
  }
  @media not all and (hover: none) and (pointer: coarse) { .touch-only { display: none; } }
</style>
</head>
<body>
<div id="game" tabindex="0" aria-label="Game area">
  <canvas id="canvas" aria-hidden="true"></canvas>

  <div id="hud" hidden>
    <div class="group"><span>Score <span id="hud-score">0</span></span><span id="hud-lives" aria-label="Lives"></span></div>
    <div class="group"><span>Best <span id="hud-best">0</span></span>
      <button class="ghost" id="btn-mute" aria-label="Toggle sound">🔊</button>
      <button class="ghost" id="btn-pause" aria-label="Pause">❚❚</button></div>
  </div>

  <section class="screen" id="screen-menu">
    <h1>ORB RUNNER</h1>
    <p>Collect the glowing orbs. Dodge the falling shards. It gets faster.</p>
    <div class="keys desktop-only">
      <span><kbd>←</kbd><kbd>↑</kbd><kbd>↓</kbd><kbd>→</kbd> / <kbd>WASD</kbd></span><span>Move</span>
      <span><kbd>P</kbd> / <kbd>Esc</kbd></span><span>Pause</span>
      <span><kbd>Enter</kbd></span><span>Start</span>
    </div>
    <p class="touch-only">Use the on-screen arrows below to move.</p>
    <button id="btn-start">Start</button>
    <p>Best: <span id="menu-best">0</span></p>
  </section>

  <section class="screen" id="screen-pause" hidden>
    <h1>Paused</h1>
    <button id="btn-resume">Resume</button>
    <button class="ghost" id="btn-quit">Quit to menu</button>
  </section>

  <section class="screen" id="screen-over" hidden>
    <h1 id="over-title">Game Over</h1>
    <div class="big" id="over-score">0</div>
    <p>Best: <span id="over-best">0</span> <span class="badge" id="over-new" hidden>★ New best!</span></p>
    <button id="btn-restart">Play again</button>
    <button class="ghost" id="btn-menu">Menu</button>
  </section>

  <div id="debug" role="alert" hidden>
    <strong>Something went wrong — the game is paused.</strong>
    <div id="debug-msg"></div>
    <div class="row"><button id="debug-resume">Try to resume</button><button id="debug-reload">Reload game</button></div>
  </div>
</div>

<div id="touch" aria-label="Touch controls">
  <div class="dpad">
    <button data-key="ArrowUp" aria-label="Up">▲</button>
    <button data-key="ArrowLeft" aria-label="Left">◀</button>
    <button data-key="ArrowDown" aria-label="Down">▼</button>
    <button data-key="ArrowRight" aria-label="Right">▶</button>
  </div>
</div>

<!-- Error guard lives in its own script tag so it is installed even if the main script
     fails to parse. The main script registers window.__onCrash to pause its loop. -->
<script>
  (function () {
    function show(err) {
      try { if (window.__onCrash) window.__onCrash(); } catch (_) {}
      var box = document.getElementById('debug');
      var msg = document.getElementById('debug-msg');
      if (!box || !msg) return;
      var text = (err && (err.stack || err.message)) || String(err);
      msg.textContent = String(text).split('\n').slice(0, 3).join(' | ');
      box.hidden = false;
    }
    window.__showCrash = show;
    window.onerror = function (message, source, line, col, err) {
      show(err || new Error(message + ' (line ' + line + ':' + col + ')'));
      return false; // keep the browser's own console logging
    };
    window.addEventListener('unhandledrejection', function (e) { show(e.reason); });
  })();
</script>

<script>
(() => {
  'use strict';

  // ===== CONFIG =====
  const W = 800, H = 450;            // logical resolution: all game code uses these units
  const STEP = 1 / 60;               // fixed simulation step in seconds
  const MAX_FRAME = 0.25;            // clamp long frames (tab switch, breakpoint) to avoid a spiral of death
  const GAME_ID = 'orb-runner';      // namespace for localStorage keys
  const REDUCE_MOTION = matchMedia('(prefers-reduced-motion: reduce)').matches;

  // ===== DOM =====
  const $ = (s) => document.querySelector(s);
  const gameEl = $('#game'), canvas = $('#canvas'), ctx = canvas.getContext('2d');
  const screens = { menu: $('#screen-menu'), paused: $('#screen-pause'), over: $('#screen-over') };

  // ===== STORAGE (throws in some sandboxed iframes / private modes, so always guard) =====
  const store = {
    get(key, fallback) {
      try { const v = localStorage.getItem(GAME_ID + ':' + key); return v === null ? fallback : JSON.parse(v); }
      catch (_) { return fallback; }
    },
    set(key, value) { try { localStorage.setItem(GAME_ID + ':' + key, JSON.stringify(value)); } catch (_) {} },
  };
  let best = Number(store.get('best', 0)) || 0;

  // ===== AUDIO (Web Audio synth; the context must be created/resumed inside a user gesture) =====
  const audio = (() => {
    let ac = null, master = null, muted = !!store.get('muted', false);
    function unlock() {
      try {
        if (!ac) {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (!AC) return null;
          ac = new AC(); master = ac.createGain(); master.gain.value = 0.2; master.connect(ac.destination);
        }
        if (ac.state === 'suspended') ac.resume();
      } catch (_) { ac = null; }
      return ac;
    }
    // One enveloped oscillator blip. Exponential ramps avoid audible clicks.
    function tone({ freq = 440, to = 0, dur = 0.1, type = 'square', vol = 0.6, delay = 0 } = {}) {
      if (muted || !ac) return;
      try {
        const t = ac.currentTime + delay, o = ac.createOscillator(), g = ac.createGain();
        o.type = type; o.frequency.setValueAtTime(freq, t);
        if (to) o.frequency.exponentialRampToValueAtTime(to, t + dur);
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(vol, t + 0.01);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(g).connect(master); o.start(t); o.stop(t + dur + 0.05);
      } catch (_) { /* audio must never crash the game */ }
    }
    return {
      unlock, tone,
      get muted() { return muted; },
      toggle() { muted = !muted; store.set('muted', muted); return muted; },
    };
  })();
  const sfx = {
    start: () => { audio.tone({ freq: 330, to: 660, dur: 0.15, type: 'triangle' }); },
    pickup: () => { audio.tone({ freq: 880, to: 1320, dur: 0.08 }); },
    hit: () => { audio.tone({ freq: 200, to: 60, dur: 0.3, type: 'sawtooth' }); },
    over: () => { [440, 330, 220].forEach((f, i) => audio.tone({ freq: f, dur: 0.18, type: 'triangle', delay: i * 0.16 })); },
  };

  // ===== INPUT =====
  // `held` answers "is this key down right now?" (continuous movement).
  // `presses` is a short queue of discrete presses drained by update(), so taps between
  // simulation steps are never lost and a burst of keys can't overflow the buffer.
  const input = (() => {
    const held = new Set(), presses = [], MAX_QUEUE = 4;
    const ALIAS = { KeyW: 'ArrowUp', KeyA: 'ArrowLeft', KeyS: 'ArrowDown', KeyD: 'ArrowRight' };
    const SCROLL_KEYS = new Set(['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space', 'PageUp', 'PageDown', 'Home', 'End']);
    let lastDevice = 'keyboard';
    // Physical key code, falling back to e.key where e.code is empty or "Unidentified"
    // (some WebViews, embedded previews, remote desktops and virtual keyboards).
    function keyCode(e) {
      if (e.code && e.code !== 'Unidentified') return e.code;
      const k = e.key || '';
      if (k === ' ' || k === 'Spacebar') return 'Space';
      if (k === 'Esc') return 'Escape';
      if (k === 'Up' || k === 'Down' || k === 'Left' || k === 'Right') return 'Arrow' + k;
      if (/^[a-z]$/i.test(k)) return 'Key' + k.toUpperCase();
      if (/^[0-9]$/.test(k)) return 'Digit' + k;
      return k;
    }
    function down(code) {
      if (!held.has(code) && presses.length < MAX_QUEUE) presses.push(code);
      held.add(code);
    }
    function up(code) { held.delete(code); }
    addEventListener('keydown', (e) => {
      const raw = keyCode(e);
      if (e.target instanceof HTMLButtonElement && (raw === 'Enter' || raw === 'Space')) return; // let buttons work
      if (SCROLL_KEYS.has(raw)) e.preventDefault(); // stop the page from scrolling
      lastDevice = 'keyboard';
      const code = ALIAS[raw] || raw;
      if (!e.repeat) { down(code); onCommandKey(code); }
    });
    addEventListener('keyup', (e) => { const raw = keyCode(e); up(ALIAS[raw] || raw); });
    addEventListener('blur', () => held.clear()); // avoid "stuck" keys after alt-tab
    // A pointer only "takes over" when it actually moves, so a mouse resting over the game
    // never overrides the arrow keys in games that support both (aim with mouse OR keys).
    addEventListener('pointermove', (e) => { if (e.movementX || e.movementY) lastDevice = 'pointer'; });
    addEventListener('pointerdown', () => { lastDevice = 'pointer'; });

    // On-screen buttons feed the same queue as the keyboard.
    document.querySelectorAll('#touch [data-key]').forEach((btn) => {
      const code = btn.dataset.key;
      btn.addEventListener('pointerdown', (e) => {
        e.preventDefault(); audio.unlock(); btn.setPointerCapture(e.pointerId);
        btn.classList.add('active'); down(code);
      });
      const release = () => { btn.classList.remove('active'); up(code); };
      btn.addEventListener('pointerup', release); btn.addEventListener('pointercancel', release);
      btn.addEventListener('lostpointercapture', release);
      btn.addEventListener('contextmenu', (e) => e.preventDefault());
    });

    return {
      isDown: (...codes) => codes.some((c) => held.has(c)),
      press: (code) => { if (presses.length < MAX_QUEUE) presses.push(code); }, // for swipes / custom buttons
      drain: () => presses.splice(0, presses.length),
      clear: () => { held.clear(); presses.length = 0; },
      get lastDevice() { return lastDevice; }, // 'keyboard' | 'pointer': whichever was used last
    };
  })();

  // Converts a pointer event to logical game coordinates (for click/tap-driven games).
  function toGame(e) {
    const r = canvas.getBoundingClientRect();
    return { x: (e.clientX - r.left) * (W / r.width), y: (e.clientY - r.top) * (H / r.height) };
  }

  // ===== CANVAS SIZING (crisp on high-DPI screens; game code always draws in W x H units) =====
  function resize() {
    const r = canvas.getBoundingClientRect();
    if (!r.width) return;
    const scale = (r.width / W) * (window.devicePixelRatio || 1);
    canvas.width = Math.round(W * scale); canvas.height = Math.round(H * scale);
    ctx.setTransform(scale, 0, 0, scale, 0, 0);
  }
  new ResizeObserver(resize).observe(canvas);

  // Inside an embedded preview (iframe), keys only arrive while the game has focus.
  // Any click or tap on the game area takes focus back, so the keyboard keeps working.
  gameEl.addEventListener('pointerdown', (e) => {
    if (!(e.target instanceof HTMLButtonElement)) gameEl.focus({ preventScroll: true });
  });
  resize();

  // ===== HUD (only touch the DOM when a value actually changes) =====
  const hud = (() => {
    const cache = {};
    const el = { score: $('#hud-score'), lives: $('#hud-lives'), best: $('#hud-best') };
    return {
      set(key, value) {
        if (cache[key] === value) return;
        cache[key] = value; el[key].textContent = value;
      },
    };
  })();

  // ===== STATE MACHINE =====
  const State = { MENU: 'menu', PLAYING: 'playing', PAUSED: 'paused', OVER: 'over' };
  let state = State.MENU;
  function setState(next) {
    state = next;
    screens.menu.hidden = next !== State.MENU;
    screens.paused.hidden = next !== State.PAUSED;
    screens.over.hidden = next !== State.OVER;
    $('#hud').hidden = !(next === State.PLAYING || next === State.PAUSED);
    if (next === State.PLAYING) {
      if (document.activeElement instanceof HTMLElement) document.activeElement.blur();
      try { window.focus(); } catch (_) {}
      gameEl.focus({ preventScroll: true });
    } else {
      const btn = { menu: '#btn-start', paused: '#btn-resume', over: '#btn-restart' }[next];
      if (btn) $(btn).focus({ preventScroll: true });
    }
  }

  function startGame() {
    audio.unlock(); input.clear();
    game = newGame(); sfx.start();
    hud.set('best', best);
    setState(State.PLAYING);
  }
  function pauseGame() { if (state === State.PLAYING) setState(State.PAUSED); }
  function resumeGame() { if (state === State.PAUSED) { input.clear(); setState(State.PLAYING); } }
  function endGame(won) {
    const isNew = game.score > best;
    if (isNew) { best = game.score; store.set('best', best); }
    $('#over-title').textContent = won ? 'You Win!' : 'Game Over';
    $('#over-score').textContent = game.score;
    $('#over-best').textContent = best;
    $('#over-new').hidden = !isNew;
    $('#menu-best').textContent = best;
    sfx.over(); setState(State.OVER);
  }

  // Keys that act immediately regardless of the simulation step.
  function onCommandKey(code) {
    if (code === 'Enter' && (state === State.MENU || state === State.OVER)) startGame();
    else if (code === 'KeyP' || code === 'Escape') {
      if (state === State.PLAYING) pauseGame(); else if (state === State.PAUSED) resumeGame();
    }
  }

  $('#btn-start').addEventListener('click', startGame);
  $('#btn-restart').addEventListener('click', startGame);
  $('#btn-resume').addEventListener('click', resumeGame);
  $('#btn-quit').addEventListener('click', () => setState(State.MENU));
  $('#btn-menu').addEventListener('click', () => setState(State.MENU));
  $('#btn-pause').addEventListener('click', pauseGame);
  const muteBtn = $('#btn-mute');
  const paintMute = () => { muteBtn.textContent = audio.muted ? '🔇' : '🔊'; };
  muteBtn.addEventListener('click', () => { audio.unlock(); audio.toggle(); paintMute(); muteBtn.blur(); });
  paintMute();
  document.addEventListener('visibilitychange', () => { if (document.hidden) pauseGame(); });
  $('#menu-best').textContent = best;

  // ===================================================================
  // ===== GAME LOGIC — replace everything in this section per game =====
  // ===================================================================
  let game = null;
  const PLAYER_SPEED = 260; // logical px per second — always scale motion by dt

  function newGame() {
    return {
      score: 0, lives: 3, time: 0, invuln: 0, shake: 0,
      player: { x: W / 2, y: H - 60, r: 14 },
      orbs: [], shards: [], spawnOrb: 0, spawnShard: 1,
    };
  }

  function update(dt) {
    const g = game;
    g.time += dt;
    input.drain(); // this demo only uses held keys; drain so the queue doesn't hold stale presses

    // Movement from held keys
    const p = g.player;
    const dx = (input.isDown('ArrowRight') ? 1 : 0) - (input.isDown('ArrowLeft') ? 1 : 0);
    const dy = (input.isDown('ArrowDown') ? 1 : 0) - (input.isDown('ArrowUp') ? 1 : 0);
    const len = Math.hypot(dx, dy) || 1;
    p.x = clamp(p.x + (dx / len) * PLAYER_SPEED * dt, p.r, W - p.r);
    p.y = clamp(p.y + (dy / len) * PLAYER_SPEED * dt, p.r + 30, H - p.r);

    // Difficulty ramps with time
    const level = 1 + g.time / 15;
    g.spawnOrb -= dt; g.spawnShard -= dt;
    if (g.spawnOrb <= 0) { g.spawnOrb = 1.2; g.orbs.push({ x: rand(30, W - 30), y: rand(70, H - 30), r: 9, life: 6 }); }
    if (g.spawnShard <= 0) {
      g.spawnShard = Math.max(0.25, 1.1 / level);
      g.shards.push({ x: rand(10, W - 10), y: -20, vy: rand(140, 220) * Math.sqrt(level), r: 10 });
    }

    for (const o of g.orbs) o.life -= dt;
    for (const s of g.shards) s.y += s.vy * dt;
    g.orbs = g.orbs.filter((o) => {
      if (circleHit(o, p)) { g.score += 10; sfx.pickup(); return false; }
      return o.life > 0;
    });
    g.invuln = Math.max(0, g.invuln - dt);
    g.shake = Math.max(0, g.shake - dt);
    g.shards = g.shards.filter((s) => {
      if (g.invuln === 0 && circleHit(s, p)) {
        g.lives -= 1; g.invuln = 1.5; g.shake = 0.3; sfx.hit();
        return false;
      }
      return s.y < H + 30;
    });

    hud.set('score', g.score);
    hud.set('lives', '♥'.repeat(Math.max(0, g.lives)));
    if (g.lives <= 0) endGame(false);
  }

  function render() {
    ctx.fillStyle = '#070a14'; ctx.fillRect(0, 0, W, H);
    // Static starfield-ish grid, drawn every frame even in menus as an attract-mode backdrop
    ctx.strokeStyle = 'rgba(76, 201, 240, 0.08)'; ctx.lineWidth = 1;
    ctx.beginPath();
    for (let x = 0; x <= W; x += 40) { ctx.moveTo(x, 0); ctx.lineTo(x, H); }
    for (let y = 0; y <= H; y += 40) { ctx.moveTo(0, y); ctx.lineTo(W, y); }
    ctx.stroke();
    if (!game) return;

    const g = game;
    ctx.save();
    if (g.shake > 0 && !REDUCE_MOTION) ctx.translate(rand(-4, 4), rand(-4, 4));
    for (const o of g.orbs) {
      ctx.globalAlpha = Math.min(1, o.life);
      glowCircle(o.x, o.y, o.r, '#80ed99');
    }
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#f72585';
    for (const s of g.shards) {
      ctx.beginPath(); ctx.moveTo(s.x, s.y - s.r * 1.6); ctx.lineTo(s.x + s.r, s.y); ctx.lineTo(s.x, s.y + s.r * 1.6);
      ctx.lineTo(s.x - s.r, s.y); ctx.closePath(); ctx.fill();
    }
    const p = g.player;
    if (g.invuln === 0 || Math.floor(g.invuln * 10) % 2 === 0) glowCircle(p.x, p.y, p.r, '#4cc9f0');
    ctx.restore();
  }

  // ----- small helpers -----
  function glowCircle(x, y, r, color) {
    ctx.fillStyle = color; ctx.shadowColor = color; ctx.shadowBlur = 16;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); ctx.shadowBlur = 0;
  }
  // ===================== END GAME LOGIC =====================

  // ===== UTILITIES =====
  function clamp(v, lo, hi) { return v < lo ? lo : v > hi ? hi : v; }
  function rand(lo, hi) { return lo + Math.random() * (hi - lo); }
  function circleHit(a, b) { const dx = a.x - b.x, dy = a.y - b.y, r = a.r + b.r; return dx * dx + dy * dy < r * r; }

  // ===== MAIN LOOP (fixed timestep: identical game speed at 30, 60 or 144 Hz) =====
  let rafId = 0, last = performance.now(), acc = 0;
  function frame(now) {
    rafId = requestAnimationFrame(frame);
    try {
      let dt = (now - last) / 1000; last = now;
      if (!(dt > 0)) dt = 0; else if (dt > MAX_FRAME) dt = MAX_FRAME;
      if (state === State.PLAYING) {
        acc += dt;
        while (acc >= STEP && state === State.PLAYING) { update(STEP); acc -= STEP; }
      } else acc = 0;
      render();
    } catch (err) {
      window.__showCrash(err); // stops the loop via __onCrash below and shows the overlay
    }
  }
  window.__onCrash = () => cancelAnimationFrame(rafId);
  $('#debug-resume').addEventListener('click', () => {
    $('#debug').hidden = true; last = performance.now(); acc = 0;
    rafId = requestAnimationFrame(frame);
  });
  $('#debug-reload').addEventListener('click', () => location.reload());

  setState(State.MENU);
  rafId = requestAnimationFrame(frame);
})();
</script>
</body>
